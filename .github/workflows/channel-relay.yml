name: Xarici Kanal Relay (EKSPERİMENTAL)

# CAMP TRADE qrupunu izləyir, hər yeni mesajı Claude ilə süzür, yalnız konkret
# əməliyyat elanlarını (siqnal) öz Telegram-ımıza göndərir. Adi söhbət/zarafat/
# təqvim mesajları sükutla keçilir. Validasiya edilməyib — bax channel-relay.mjs.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: channel-relay
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: "claude-fable-5"
      CHANNEL_ID: "-1002369027049"
      CHANNEL_LABEL: "CAMP TRADE"
      DATA_DIR: data

    steps:
      - name: Reponu yüklə
        uses: actions/checkout@v4

      - name: Node quraşdır
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Asılılıqları quraşdır
        run: npm ci

      - name: Əvvəlki vəziyyəti yüklə
        run: |
          mkdir -p data
          if git fetch --depth=1 origin relay-state 2>/dev/null; then
            git checkout FETCH_HEAD -- data
          else
            echo "relay-state budağı yoxdur — təmiz başlanğıc."
          fi

      - name: Relay-i işə sal
        run: node channel-relay.mjs

      - name: Vəziyyəti saxla
        if: always()
        env:
          GIT_AUTHOR_NAME: claude-execute-bot
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: claude-execute-bot
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          export GIT_INDEX_FILE="${RUNNER_TEMP}/relay-state.index"
          rm -f "$GIT_INDEX_FILE"
          git add -f data
          TREE=$(git write-tree)
          PREV=$(git rev-parse --quiet --verify FETCH_HEAD^{tree} || true)
          if [ -n "$PREV" ] && [ "$PREV" = "$TREE" ]; then
            echo "Vəziyyət dəyişməyib — push edilmir."
            exit 0
          fi
          COMMIT=$(git commit-tree "$TREE" -m "relay-state: $(date -u '+%Y-%m-%d %H:%M UTC')")
          for i in 1 2 3; do
            if git push -f origin "$COMMIT:refs/heads/relay-state"; then
              echo "✅ Vəziyyət saxlanıldı."
              exit 0
            fi
            echo "Push alınmadı ($i/3) — yenidən cəhd..."
            sleep 3
          done
          echo "::error::Vəziyyət saxlanıla bilmədi."
          exit 1
