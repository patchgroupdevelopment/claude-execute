name: Ticarət Siqnalları

# Hər 15 dəqiqədən bir işləyir (repo public = Actions dəqiqəsi limitsiz).
# :07/:22/:37/:52 seçilib — saat başı (:00) GitHub-da ən sıx vaxtdır, cron orada gecikir.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force_weekly_report:
        description: "Həftəlik hesabatı indi göndər (gün/saat şərtinə baxmadan)"
        type: boolean
        default: false
      ict_test:
        description: "ICT TEST siqnalı göndər (real deyil — yalnız formatı yoxlamaq üçün)"
        type: boolean
        default: false
      force_psar:
        description: "PSAR günlük brifinqini indi göndər (saat şərtinə baxmadan)"
        type: boolean
        default: false

# State fayllarını repoya geri yazmaq üçün lazımdır
permissions:
  contents: write

# Eyni anda iki dövrə işləməsin — yoxsa state faylları korlanar
concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # ── Gizli məlumatlar ──
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # İstəyə bağlı: qoyulsa hər siqnalda Claude ikinci rəy verir (məsləhət, bloklamır).
      # Fable 5 seçilib: Sonnet ilə eyni qərara gəlir, amma izahatı xeyli konkretdir
      # (test: şam datasından dəstək zonasını özü tapdı) — bu həcmdə qiymət fərqi cüzidir.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: "claude-fable-5"

      # ── Qalıcı yaddaş ──
      DATA_DIR: data
      MAX_LOG_ENTRIES: "600"

      # ── Ticarət konfiqurasiyası (4H mean-reversion) ──
      # PAXGUSDT çıxarıldı: qızıl indi GÜNLÜK Donchian breakout ilə işləyir (aşağıya bax) —
      # 4H EMA9/20+ADX trend-following 25 illik testdə robust çıxmadı, Donchian daha yaxşı nəticə verdi.
      SYMBOLS: BTCUSDT,ETHUSDT
      TIMEFRAME: "4H"
      PORTFOLIO_VALUE_USD: "1300"
      MAX_TRADE_SIZE_USD: "100"
      MAX_TRADES_PER_DAY: "10"
      PAPER_TRADING_BALANCE_USD: "1000"

      # ── Strategiya ──
      FOCUS_SYMBOLS: ETHUSDT
      TREND_SYMBOLS: ""

      # ── ICT modeli (TƏCRÜBİ — gəlirlilik baxımından ÖLÇÜLMƏYİB) ──
      # 45 videoluq bootcamp-dan çıxarılmış model. Digər strategiyalardan fərqli
      # olaraq backtest edilməyib — siqnallar "TƏCRÜBİ" damğası ilə gəlir və
      # avtomatik icra OLUNMUR. Söndürmək üçün: "0" qoy və ya sətri sil.
      # Anthropic API tələb ETMİR.
      # PSAR + EMA200 + MACD — günlük, yalnız LONG.
      # Əlavə edilməzdən ƏVVƏL ölçülüb (scripts/backtest-psar-ema-macd.mjs):
      # 10 il · 612 əməliyyat · +0.180R · t=3.96 · zaman-yarısı sabit.
      # Aşağı taymfreym (t=0.83) və short tərəf ölçülərək RƏDD edilib.
      PSAR_SIGNALS: "1"
      FORCE_PSAR: ${{ inputs.force_psar && '1' || '0' }}
      ICT_SIGNALS: "1"
      ICT_FRESH_BARS: "3"
      # Formalaşan setup bildirişi: sweep olub, MSS/giriş gözlənilir.
      # Bu, ƏMR deyil — "diqqətdə saxla" xəbərdarlığıdır. Söndürmək: "0"
      ICT_FORMING: "1"
      # Seans/killzone filtri SÖNÜKDÜR — sistem 24/7 analiz edir.
      # Ölçüldü: killzone saatlarında indeks setup-ları tamamlanmır
      # (TRADING-LEARNINGS §6, §8). Açmaq üçün: ICT_USE_SESSIONS: "1"
      ICT_USE_SESSIONS: "0"
      ICT_TEST: ${{ inputs.ict_test && '1' || '0' }}

      # ── S&P 500 və US100 günlük siqnalı (NY açılışından sonra hər ticarət günü brifinq) ──
      SP500: "1"
      US100: "1"

      # ── Qızıl günlük Donchian(20) breakout + ATR trailing stop (yalnız LONG) ──
      # 25 illik GC=F testi: BUY tərəfi +195% (151 əməliyyat, 55% win, hər iki
      # yarıda sabit). SHORT tərəfi -70% idi (32% win) — ona görə BİLƏRƏKDƏN
      # yalnız long axtarılır. Əvəzlədiyi 4H trend-following-dən qat-qat sabitdir.
      GOLD: "1"

      # ── Neft (Brent) günlük trend-following siqnalı — EKSPERİMENTAL, validasiya
      # edilməyib (10 illik backtest: ADX həddinə görə nəticə +1.4%-dən -2.8%-ə
      # sıçrayır, tarixdə tək əməliyyatda -18.8% itki). İstifadəçinin qərarı ilə aktivdir.
      OIL: "1"

      # ── Xəbər analizi: RSS lentləri + Claude təsir qiymətləndirməsi ──
      NEWS: "1"
      NEWS_MODEL: "claude-sonnet-5"

      # ── İqtisadi təqvim (FMP, pulsuz tier — 250 sorğu/gün) ──
      # Yüksək-təsirli ABŞ göstəricilərindən (NFP, CPI, Fed və s.) 35 dəqiqə əvvəl
      # xəbərdarlıq göndərir. FMP_API_KEY qoyulmayana qədər səssizcə keçir.
      ECON_CALENDAR: "1"
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      # ── Manual qiymət səviyyəsi xəbərdarlıqları (Fuadın spot qərarı üçün) ──
      # ETH: 1835-in altında bağlansa "düşəcək" siqnalı, 1860-ın üstündə bağlansa əks siqnal
      PRICE_ALERTS: "ETHUSDT<1835,ETHUSDT>1860"

      # ── XM icra planı (siqnal mesajındakı lot hesabı) ──
      XM_ACCOUNT_USD: "2000"
      XM_RISK_PCT: "1.5"

    steps:
      - name: Reponu yüklə
        uses: actions/checkout@v4

      - name: Node versiyası
        run: node --version

      # Vəziyyət `state` budağında saxlanılır — `main` yalnız koddur.
      # Səbəb: qərar logu hər dövrədə ~1.6 MB-dır; onu main-ə commit etsək
      # repo gündə ~78 MB böyüyər və bir ilə GitHub limitinə çatıb push-ları bloklayar.
      - name: Əvvəlki vəziyyəti yüklə
        run: |
          mkdir -p data
          if git fetch --depth=1 origin state 2>/dev/null; then
            git checkout FETCH_HEAD -- data
            echo "Əvvəlki vəziyyət bərpa olundu:"
            ls -la data
          else
            echo "state budağı yoxdur — təmiz başlanğıc."
          fi

      - name: Botu işə sal
        env:
          FORCE_WEEKLY_REPORT: ${{ inputs.force_weekly_report && '1' || '' }}
        run: |
          mkdir -p data
          node bot.js

      # Hər dəfə valideynsiz (orphan) tək commit yaradılıb `state` budağına force-push edilir.
      # Beləliklə budaqda həmişə cəmi 1 commit olur — tarixçə yığılmır, repo böyümür.
      - name: Vəziyyəti saxla
        if: always()
        env:
          GIT_AUTHOR_NAME: claude-execute-bot
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: claude-execute-bot
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          # Yalnız data/ qovluğunu əhatə edən təmiz indeks qur
          export GIT_INDEX_FILE="${RUNNER_TEMP}/state.index"
          rm -f "$GIT_INDEX_FILE"
          git add -f data
          TREE=$(git write-tree)

          PREV=$(git rev-parse --quiet --verify FETCH_HEAD^{tree} || true)
          if [ -n "$PREV" ] && [ "$PREV" = "$TREE" ]; then
            echo "Vəziyyət dəyişməyib — push edilmir."
            exit 0
          fi

          COMMIT=$(git commit-tree "$TREE" -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')")
          for i in 1 2 3; do
            if git push -f origin "$COMMIT:refs/heads/state"; then
              echo "✅ Vəziyyət saxlanıldı (state budağı, tək commit)."
              exit 0
            fi
            echo "Push alınmadı ($i/3) — yenidən cəhd..."
            sleep 5
          done
          echo "::error::Vəziyyət saxlanıla bilmədi."
          exit 1

      - name: Xəta olarsa Telegrama bildir
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "Telegram tokeni yoxdur — bildiriş göndərilmir."
            exit 0
          fi
          TEXT="🚨 <b>BOT DÖVRƏSİ UĞURSUZ OLDU</b>"
          TEXT="${TEXT}"$'\n'"Siqnal yoxlaması icra oluna bilmədi — bu dövrədə siqnal GƏLMƏYƏCƏK."
          TEXT="${TEXT}"$'\n\n'"Növbəti cəhd: ~30 dəqiqə sonra."
          TEXT="${TEXT}"$'\n'"Təfərrüat: ${RUN_URL}"
          curl -sS --max-time 20 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" > /dev/null
          echo "Xəta bildirişi göndərildi."
