name: Kanal Tarixçəsi Auditi (birdəfəlik)

# Verilmiş Telegram qrupunun bütün mesaj tarixçəsini çəkib data/ branch-ına yazır.
# Yalnız əl ilə (workflow_dispatch) işə düşür.
on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Audit ediləcək Telegram chat ID (məs. -1004369378478)"
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 16

    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      AUDIT_CHAT_ID: ${{ inputs.chat_id }}
      DATA_DIR: data

    steps:
      - name: Reponu yüklə
        uses: actions/checkout@v4

      - name: Node quraşdır
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Asılılıqları quraşdır
        run: npm ci

      - name: Auditi işə sal
        run: node scripts/audit-channel-history.mjs

      - name: Nəticəni audit-data budağına saxla
        if: always()
        env:
          GIT_AUTHOR_NAME: claude-execute-bot
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: claude-execute-bot
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          export GIT_INDEX_FILE="${RUNNER_TEMP}/audit.index"
          rm -f "$GIT_INDEX_FILE"
          git add -f data/audit-borsaworkout-group.json
          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" -m "audit: $(date -u '+%Y-%m-%d %H:%M UTC')")
          git push -f origin "$COMMIT:refs/heads/audit-data"
          echo "✅ Nəticə audit-data budağına yazıldı."
